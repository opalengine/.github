name: Bug report
description: Something doesn't work as documented or expected.
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        Give it a short, specific title. Search existing issues first.
        Security problems don't go here: see [SECURITY.md](https://github.com/opalengine/.github/blob/main/SECURITY.md).
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: One sentence on what should work once this is fixed.
      placeholder: "`report --csv` writes a valid CSV when an entry contains a comma."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps that shows the bug.
      placeholder: |
        1. Run `...`
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What happened instead. Paste errors or logs as text, with secrets removed.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The release, tag or commit you're running.
      placeholder: v1.2.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance
      description: Optional. The checks that prove it's fixed, one per line, each starting with `- `.
      placeholder: |
        - An entry with a comma is quoted in the CSV output
        - A regression test covers it
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Anything else that helps. Optional.
    validations:
      required: false
